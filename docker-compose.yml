# Local development database. For production, use any managed/self-hosted PostgreSQL 14+.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tienda
      POSTGRES_PASSWORD: tienda
      POSTGRES_DB: tienda_online
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tienda_pgdata:/var/lib/postgresql/data
volumes:
  tienda_pgdata:
